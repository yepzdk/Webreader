[versions]
# AGP 9 compiles Kotlin itself; there is deliberately no Kotlin Gradle plugin here, because
# `org.jetbrains.kotlin.android` is incompatible with AGP 9's DSL.
agp = "9.3.0"
# Material carries appcompat, core and activity with it; those three are declared anyway
# because this app calls them directly, and a transitive version is not a contract.
material = "1.14.0"
appcompat = "1.8.0"
# 1.19 requires compiling against API 37; this project compiles against 36, which is the
# highest AGP 9.3 supports.
core = "1.18.0"
activity = "1.13.0"
# The only way to walk a Storage Access Framework tree without hand-rolling
# DocumentsContract cursors.
documentfile = "1.1.0"
# `prefers-color-scheme` inside a WebView follows the app's night mode only when algorithmic
# darkening is allowed, and that switch has no framework spelling.
webkit = "1.17.0"

[libraries]
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core = { group = "androidx.core", name = "core-ktx", version.ref = "core" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
