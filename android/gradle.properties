# The Kotlin daemon and the Android build both want room; the default 512m heap makes AGP
# spend the build swapping.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX only. Jetifier is not enabled: nothing here depends on a support-library artifact.
android.useAndroidX=true

kotlin.code.style=official
