<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app's mark: a chapter opening. A brass drop cap, the paragraph it starts, and a
       page marker beside them. Full bleed and opaque, because iOS masks the corners itself
       and the App Store rejects an alpha channel.

       Nothing touches an edge, which is what lets Android's round mask keep all of it, and
       the block is centred on both axes (x 121-902, y 238-784).

       This file is the only source. Scripts/make-icons.sh renders every platform from it,
       and relies on the <svg> element opening on the first line and closing on the last. -->
